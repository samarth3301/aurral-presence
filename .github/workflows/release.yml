name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Test
        run: cargo test --locked
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          name="aurral-presence-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          if [[ "$TARGET" == *windows* ]]; then binary=aurral-presence.exe; else binary=aurral-presence; fi
          cp "target/$TARGET/release/$binary" README.md LICENSE CHANGELOG.md config.json .env.example "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            asset="$name.zip"
            7z a "$asset" "$name" > /dev/null
          else
            asset="$name.tar.gz"
            tar czf "$asset" "$name"
          fi
          shasum -a 256 "$asset" > "$asset.sha256"
          gh release upload "$GITHUB_REF_NAME" "$asset" "$asset.sha256" --clobber
