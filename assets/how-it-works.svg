<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1000" height="320" rx="20" fill="#0f172a"/>
  <text x="500" y="44" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">How aurral-presence works</text>

  <g font-size="17" text-anchor="middle">
    <rect x="30" y="100" width="200" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="130" y="148" fill="#f8fafc" font-weight="700">Aurral web player</text>
    <text x="130" y="174" fill="#94a3b8" font-size="14">in your browser</text>

    <rect x="280" y="100" width="200" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="380" y="148" fill="#f8fafc" font-weight="700">Aurral server</text>
    <text x="380" y="174" fill="#94a3b8" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/api/play-queue</text>

    <rect x="530" y="100" width="200" height="110" rx="14" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
    <text x="630" y="148" fill="#f8fafc" font-weight="700">aurral-presence</text>
    <text x="630" y="174" fill="#c4b5fd" font-size="14">runs on your computer</text>

    <rect x="780" y="100" width="190" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="875" y="148" fill="#f8fafc" font-weight="700">Discord desktop</text>
    <text x="875" y="174" fill="#94a3b8" font-size="14">status on your profile</text>
  </g>

  <g stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="234" y1="155" x2="274" y2="155"/>
    <line x1="484" y1="155" x2="524" y2="155"/>
    <line x1="734" y1="155" x2="774" y2="155"/>
  </g>

  <g font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="254" y="240">saves queue on</text>
    <text x="254" y="258">play, pause, skip</text>
    <text x="504" y="240">read every 5s</text>
    <text x="504" y="258">with your API key</text>
    <text x="754" y="240">local IPC,</text>
    <text x="754" y="258">never leaves the PC</text>
  </g>

  <text x="500" y="298" text-anchor="middle" fill="#64748b" font-size="13">Pause clears the status within seconds · Resume brings it back on the next save · No ports opened</text>
</svg>
