[package]
name = "aurral-presence"
version = "0.1.0"
edition = "2024"

[dependencies]
discord-rich-presence = "1.1.0"
dotenvy = "0.15.7"
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
